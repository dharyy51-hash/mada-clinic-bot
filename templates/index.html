<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ clinic.business_name }} — مساعد ذكي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #F7F7F8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 750px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #fff;
      border-bottom: 1px solid #EBEBEB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: #F0F0F0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h2 {
      color: #0D0D0D;
      font-size: 15px;
      font-weight: 600;
    }

    .header-info p {
      color: #6E6E80;
      font-size: 12px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #19C37D;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Powered by */
    .powered {
      text-align: center;
      padding: 5px;
      background: #FAFAFA;
      border-bottom: 1px solid #EBEBEB;
    }

    .powered span {
      font-size: 10px;
      color: #AEAEAE;
    }

    .powered a {
      color: #19C37D;
      text-decoration: none;
      font-weight: 600;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #EBEBEB; border-radius: 4px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .avatar.bot { background: #19C37D22; }
    .avatar.user { background: #F0F0F0; }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.bot {
      background: #F4F4F5;
      color: #0D0D0D;
      border-bottom-right-radius: 4px;
    }

    .msg.user {
      background: #0D0D0D;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #AEAEAE;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      background: #fff;
      border-top: 1px solid #EBEBEB;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      background: #F4F4F5;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      color: #0D0D0D;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      direction: rtl;
      transition: background 0.2s;
    }

    #userInput:focus { background: #EBEBEB; }
    #userInput::placeholder { color: #AEAEAE; }

    #sendBtn {
      width: 40px;
      height: 40px;
      background: #0D0D0D;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    #sendBtn:hover { background: #333; }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { background: #EBEBEB; cursor: not-allowed; }
    #sendBtn svg { fill: #fff; }
    #sendBtn:disabled svg { fill: #AEAEAE; }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .quick-btn {
      background: #fff;
      border: 1px solid #DCDCDC;
      color: #0D0D0D;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .quick-btn:hover { background: #F4F4F5; border-color: #AEAEAE; }
  </style>
</head>
<body>
<div class="chat-wrapper">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🏥</div>
    <div class="header-info">
      <h2>{{ clinic.business_name }}</h2>
      <p><span class="status-dot"></span> مساعد ذكي — متاح 24/7</p>
    </div>
  </div>

  <!-- Powered by -->
  <div class="powered">
    <span>مدعوم بالذكاء الاصطناعي بواسطة <a href="#">mada.kw</a></span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg-row bot">
      <div class="avatar bot">🤖</div>
      <div class="msg bot">
        مرحباً بك في {{ clinic.business_name }} 👋<br>
        أنا مساعدك الذكي، كيف أقدر أساعدك اليوم؟
        <div class="quick-replies">
          <button class="quick-btn" onclick="sendQuick('أوقات الدوام')">⏰ أوقات الدوام</button>
          <button class="quick-btn" onclick="sendQuick('أبي أحجز موعد')">📅 حجز موعد</button>
          <button class="quick-btn" onclick="sendQuick('الأسعار')">💰 الأسعار</button>
          <button class="quick-btn" onclick="sendQuick('الموقع')">📍 الموقع</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك..." autocomplete="off"/>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("userInput");
  const sendBtn    = document.getElementById("sendBtn");

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  function addMsg(text, role) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatar = document.createElement("div");
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === "bot" ? "🤖" : "👤";

    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = text.replace(/\n/g, "<br>");

    row.appendChild(avatar);
    row.appendChild(div);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "avatar bot";
    avatar.textContent = "🤖";

    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(avatar);
    row.appendChild(div);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMsg(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      hideTyping();
      addMsg(data.reply || "حدث خطأ، حاول مرة أخرى", "bot");
    } catch {
      hideTyping();
      addMsg("تعذّر الاتصال، تحقق من الإنترنت", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
