<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ clinic.business_name }} — مساعد ذكي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0D1B2A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 750px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0A2540, #0D1B2A);
      border: 1px solid #1E3A5F;
      border-radius: 20px 20px 0 0;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      background: #00D4FF22;
      border: 2px solid #00D4FF55;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header-info h2 {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .header-info p {
      color: #00D4FF;
      font-size: 12px;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00E676;
      border-radius: 50%;
      display: inline-block;
      margin-left: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Powered by */
    .powered {
      text-align: center;
      padding: 6px;
      background: #0A2540;
      border-left: 1px solid #1E3A5F;
      border-right: 1px solid #1E3A5F;
    }

    .powered span {
      font-size: 10px;
      color: #4A6FA5;
    }

    .powered a {
      color: #00D4FF;
      text-decoration: none;
      font-weight: 600;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      background: #0A1929;
      border-left: 1px solid #1E3A5F;
      border-right: 1px solid #1E3A5F;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #1E3A5F; border-radius: 4px; }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.bot {
      background: #0D2137;
      border: 1px solid #1E3A5F;
      color: #E0EAF5;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, #00A8CC, #00D4FF);
      color: #0D1B2A;
      font-weight: 500;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #00D4FF;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    /* Input area */
    .input-area {
      background: #0D1B2A;
      border: 1px solid #1E3A5F;
      border-top: none;
      border-radius: 0 0 20px 20px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      background: #0A2540;
      border: 1px solid #1E3A5F;
      border-radius: 25px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }

    #userInput:focus { border-color: #00D4FF55; }
    #userInput::placeholder { color: #4A6FA5; }

    #sendBtn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00A8CC, #00D4FF);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    #sendBtn:hover { transform: scale(1.08); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #sendBtn svg { fill: #0D1B2A; }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .quick-btn {
      background: #0D2137;
      border: 1px solid #1E3A5F;
      color: #00D4FF;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .quick-btn:hover { background: #1E3A5F; }
  </style>
</head>
<body>
<div class="chat-wrapper">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🏥</div>
    <div class="header-info">
      <h2>{{ clinic.business_name }}</h2>
      <p><span class="status-dot"></span> مساعد ذكي — متاح 24/7</p>
    </div>
  </div>

  <!-- Powered by -->
  <div class="powered">
    <span>مدعوم بالذكاء الاصطناعي بواسطة <a href="#">mada.kw</a></span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg bot">
      مرحباً بك في {{ clinic.business_name }} 👋<br>
      أنا مساعدك الذكي، كيف أقدر أساعدك اليوم؟
      <div class="quick-replies" style="margin-top:10px">
        <button class="quick-btn" onclick="sendQuick('أوقات الدوام')">⏰ أوقات الدوام</button>
        <button class="quick-btn" onclick="sendQuick('أبي أحجز موعد')">📅 حجز موعد</button>
        <button class="quick-btn" onclick="sendQuick('الأسعار')">💰 الأسعار</button>
        <button class="quick-btn" onclick="sendQuick('الموقع')">📍 الموقع</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك..." autocomplete="off"/>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("userInput");
  const sendBtn    = document.getElementById("sendBtn");

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  function addMsg(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = text.replace(/\n/g, "<br>");
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.id = "typing";
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMsg(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      hideTyping();
      addMsg(data.reply || "حدث خطأ، حاول مرة أخرى", "bot");
    } catch {
      hideTyping();
      addMsg("تعذّر الاتصال، تحقق من الإنترنت", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
